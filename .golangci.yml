linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
  disable-all: false

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/xurrent/xurrent-mcp

issues:
  exclude-dirs:
    - go-xurrent
  exclude-files:
    - ".*_test\\.go$"
    - ".*/test/.*"

run:
  timeout: 5m
