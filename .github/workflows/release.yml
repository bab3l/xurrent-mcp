name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xurrent-mcp
        uses: actions/checkout@v4
        with:
          path: xurrent-mcp
      - name: Checkout go-xurrent
        uses: actions/checkout@v4
        with:
          repository: bab3l/go-xurrent
          path: go-xurrent
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build cross-platform binaries
        working-directory: xurrent-mcp
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/xurrent-mcp-linux-amd64 ./cmd/xurrent-mcp
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/xurrent-mcp-linux-arm64 ./cmd/xurrent-mcp
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/xurrent-mcp-darwin-amd64 ./cmd/xurrent-mcp
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/xurrent-mcp-darwin-arm64 ./cmd/xurrent-mcp
          sha256sum dist/* > dist/checksums.txt

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: xurrent-mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: xurrent-mcp/dist/*
          generate_release_notes: true
          body: |
            ## xurrent-mcp ${{ github.ref_name }}

            MCP (Model Context Protocol) server for the Xurrent ITSM platform.

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker run -e XURRENT_TOKEN=... -e XURRENT_ACCOUNT=... -p 8080:8080 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### Binaries
            Pre-built binaries for Linux (amd64/arm64) and macOS (amd64/arm64) attached below.

            ### Quick Start
            1. Get a Xurrent personal access token from https://developer.xurrent.com/v1/
            2. Run the container with your credentials
            3. Configure VS Code / Cursor / Claude Desktop to use the MCP server

            See README for full documentation.
