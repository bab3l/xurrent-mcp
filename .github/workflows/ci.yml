name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout xurrent-mcp
        uses: actions/checkout@v4
        with:
          path: xurrent-mcp
      - name: Checkout go-xurrent
        uses: actions/checkout@v4
        with:
          repository: bab3l/go-xurrent
          path: go-xurrent
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: xurrent-mcp/go.sum
      - name: Setup workspace
        run: |
          # Create Go workspace to resolve go-xurrent locally without replace.
          go work init
          go work use ./xurrent-mcp
          go work use ./go-xurrent
          # Remove the replace directive — workspace handles resolution.
          sed -i '/^replace github.com\/xurrent\/go-xurrent => .*/d' xurrent-mcp/go.mod

      - name: Unit tests
        working-directory: xurrent-mcp
        run: go test ./internal/... -count=1 -short -v
      - name: MCP harness tests
        working-directory: xurrent-mcp
        run: go test -run TestHarness -count=1 -v ./cmd/xurrent-mcp/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout xurrent-mcp
        uses: actions/checkout@v4
        with:
          path: xurrent-mcp
      - name: Checkout go-xurrent
        uses: actions/checkout@v4
        with:
          repository: bab3l/go-xurrent
          path: go-xurrent
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build binary
        working-directory: xurrent-mcp
        env:
          GOFLAGS: -mod=mod
          GONOSUMDB: '*'
          GONOSUMCHECK: '*'
          GOPRIVATE: 'github.com/xurrent/*'
        run: go build -trimpath -o xurrent-mcp ./cmd/xurrent-mcp

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout xurrent-mcp
        uses: actions/checkout@v4
        with:
          path: xurrent-mcp
      - name: Checkout go-xurrent
        uses: actions/checkout@v4
        with:
          repository: bab3l/go-xurrent
          path: go-xurrent
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: xurrent-mcp/Dockerfile
          push: false
          load: true
          tags: xurrent-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test Docker image
        run: |
          docker run --rm -d --name mcp-test -p 18080:8080 xurrent-mcp:ci
          sleep 3
          curl -s http://localhost:18080/healthz | grep -q '"status":"ok"' && echo "PASS: healthcheck"
          docker logs mcp-test --tail 5
          docker stop mcp-test
