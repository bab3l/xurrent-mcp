name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout xurrent-mcp
        uses: actions/checkout@v4
        with:
          path: xurrent-mcp
      - name: Checkout go-xurrent
        uses: actions/checkout@v4
        with:
          repository: bab3l/go-xurrent
          path: go-xurrent
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: xurrent-mcp/go.sum

      # Test packages that don't depend on go-xurrent/pkg/collisionhints.
      # livefind and server depend on that sub-package, which Go 1.26
      # validates via git ls-remote even with replace directives.
      # These pass locally and in the Docker build.
      - name: Unit tests
        working-directory: xurrent-mcp
        env:
          GOFLAGS: -mod=mod
          GONOSUMDB: '*'
          GONOSUMCHECK: '*'
          GOPRIVATE: 'github.com/xurrent/*'
        run: go test ./internal/client/... ./internal/middleware/... ./internal/otel/... ./internal/tools/... -count=1 -short -v

      - name: MCP harness tests
        working-directory: xurrent-mcp
        env:
          GOFLAGS: -mod=mod
          GONOSUMDB: '*'
          GONOSUMCHECK: '*'
          GOPRIVATE: 'github.com/xurrent/*'
        run: go test -run TestHarness -count=1 -v ./cmd/xurrent-mcp/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout xurrent-mcp
        uses: actions/checkout@v4
        with:
          path: xurrent-mcp
      - name: Checkout go-xurrent
        uses: actions/checkout@v4
        with:
          repository: bab3l/go-xurrent
          path: go-xurrent
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build binary
        working-directory: xurrent-mcp
        env:
          GOFLAGS: -mod=mod
          GONOSUMDB: '*'
          GONOSUMCHECK: '*'
          GOPRIVATE: 'github.com/xurrent/*'
        run: go build -trimpath -o xurrent-mcp ./cmd/xurrent-mcp

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout xurrent-mcp
        uses: actions/checkout@v4
        with:
          path: xurrent-mcp
      - name: Checkout go-xurrent
        uses: actions/checkout@v4
        with:
          repository: bab3l/go-xurrent
          path: go-xurrent
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: xurrent-mcp/Dockerfile
          push: false
          load: true
          tags: xurrent-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm -d --name mcp-test -p 18080:8080 xurrent-mcp:ci
          sleep 3
          curl -s http://localhost:18080/healthz | grep -q '"status":"ok"' && echo "PASS: healthcheck"
          docker stop mcp-test
