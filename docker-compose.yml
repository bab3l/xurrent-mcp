services:
  xurrent-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - PORT=8080
      - LOG_LEVEL=info
      # Set via .env or environment:
      - XURRENT_TOKEN=${XURRENT_TOKEN}
      - XURRENT_ACCOUNT=${XURRENT_ACCOUNT}
      - XURRENT_ALLOW_MUTATIONS=${XURRENT_ALLOW_MUTATIONS:-0}
      - XURRENT_HTTP_MIN_INTERVAL=${XURRENT_HTTP_MIN_INTERVAL:-0.4}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
